name: Bug report
description: 报告已脱敏、可安全复现的功能或兼容性问题
title: "[Bug] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        此表单内容公开。安全漏洞或任何含私人证据的问题请停止填写，改用 SECURITY.md 的私密联络流程。不要粘贴窗口标题、正文、账号、token、用户路径、截图、UIA map、DOM 快照、命令行或动作收据。
  - type: input
    id: revision
    attributes:
      label: 版本或 commit
      description: 使用发布版本号或完整 commit SHA，不要包含本地路径。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 已脱敏环境
      description: Windows、PowerShell、Node（若涉及 CDP）和应用版本；不要写用户名、设备名或安装路径。
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 控制层
      options:
        - L0 CLI / COM / CDP
        - L1 UI Automation
        - L2 foreground coordinate input
        - L3 capture / evidence
        - Doctor / cache / cleanup / benchmark
        - Documentation / packaging
        - Unknown
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: 最小命令
      description: 仅提供已删去路径、标题、正文、selector、PID、端口和秘密的命令形状。
    validations:
      required: true
  - type: dropdown
    id: exit_code
    attributes:
      label: 退出码
      options:
        - "0 - reported verified success"
        - "1 - definite failure"
        - "2 - safe refusal or unknown effect"
        - Not available / command did not start
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 只写状态与计数；不要复制原始输出或私人 UI 内容。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 安全复现步骤
      description: 只包含可逆、已授权步骤。不要执行发送、支付、删除、关闭未保存文档等最终动作。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开前确认
      options:
        - label: 我已移除标题、正文、账号、token、路径、截图、map、DOM、命令行、PID/端口和收据中的敏感信息。
          required: true
        - label: 这不是需要私密报告的安全漏洞，也没有为了复现执行不可逆动作。
          required: true
