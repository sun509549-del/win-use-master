<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">win-use-master 分层控制与取证架构</title>
  <desc id="desc">任务意图经过只读发现和层级路由，优先使用 L0 结构接口与 L1 UI Automation，必要时降级到 L2 SendInput，L3 像素贯穿验证。所有写操作经过安全边界并形成证据闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 32px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .box-title { font: 700 18px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .pill { font: 600 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #ffffff; letter-spacing: .5px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" class="title">win-use-master：先结构，后语义，再坐标；全程验证</text>
  <text x="48" y="84" class="subtitle">Windows 桌面自动化不是“看见就点”，而是控制面选择、安全拒绝与机器可读取证的闭环。</text>

  <g filter="url(#shadow)">
    <rect x="48" y="126" width="206" height="94" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="70" y="145" width="72" height="24" rx="12" fill="#2563eb"/>
    <text x="106" y="162" text-anchor="middle" class="pill">入口</text>
    <text x="70" y="190" class="box-title">用户任务意图</text>
    <text x="70" y="211" class="small">明确目标、范围与停手线</text>

    <rect x="48" y="274" width="206" height="116" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="70" y="293" width="72" height="24" rx="12" fill="#0891b2"/>
    <text x="106" y="310" text-anchor="middle" class="pill">只读</text>
    <text x="70" y="338" class="box-title">能力发现</text>
    <text x="70" y="361" class="box-text">probe · windows · see</text>
    <text x="70" y="382" class="small">身份 / 端口 / UIA / 渲染</text>

    <rect x="48" y="444" width="206" height="102" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="70" y="463" width="72" height="24" rx="12" fill="#7c3aed"/>
    <text x="106" y="480" text-anchor="middle" class="pill">决策</text>
    <text x="70" y="508" class="box-title">选择最低干扰层</text>
    <text x="70" y="531" class="small">失败才降级，不凭框架猜能力</text>
  </g>

  <path d="M151 220 V269" class="arrow"/>
  <path d="M151 390 V439" class="arrow"/>
  <path d="M254 478 H280 V238 H299" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="304" y="126" width="210" height="224" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="326" y="148" width="46" height="25" rx="12" fill="#2563eb"/>
    <text x="349" y="165" text-anchor="middle" class="pill">L0</text>
    <text x="326" y="203" class="box-title">结构接口</text>
    <text x="326" y="230" class="box-text">CLI / COM</text>
    <text x="326" y="254" class="box-text">URL protocol / 本地端口</text>
    <text x="326" y="278" class="box-text">CDP target 与 DOM</text>
    <line x1="326" y1="298" x2="492" y2="298" stroke="#bfdbfe"/>
    <text x="326" y="321" class="small">首选 · 通常零焦点</text>

    <rect x="534" y="126" width="210" height="224" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <rect x="556" y="148" width="46" height="25" rx="12" fill="#059669"/>
    <text x="579" y="165" text-anchor="middle" class="pill">L1</text>
    <text x="556" y="203" class="box-title">UIA 语义树</text>
    <text x="556" y="230" class="box-text">ValuePattern</text>
    <text x="556" y="254" class="box-text">Invoke / Toggle / Select</text>
    <text x="556" y="278" class="box-text">6 秒隔离 worker</text>
    <line x1="556" y1="298" x2="722" y2="298" stroke="#a7f3d0"/>
    <text x="556" y="321" class="small">按语义定位 · 独立读回</text>

    <rect x="764" y="126" width="210" height="224" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <rect x="786" y="148" width="46" height="25" rx="12" fill="#ea580c"/>
    <text x="809" y="165" text-anchor="middle" class="pill">L2</text>
    <text x="786" y="203" class="box-title">前台坐标输入</text>
    <text x="786" y="230" class="box-text">SendInput</text>
    <text x="786" y="254" class="box-text">点击 / 滚动 / Unicode</text>
    <text x="786" y="278" class="box-text">短暂借焦点并归还</text>
    <line x1="786" y1="298" x2="952" y2="298" stroke="#fed7aa"/>
    <text x="786" y="321" class="small">明确降级 · 完整安全闸</text>

    <rect x="994" y="126" width="238" height="224" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <rect x="1016" y="148" width="46" height="25" rx="12" fill="#9333ea"/>
    <text x="1039" y="165" text-anchor="middle" class="pill">L3</text>
    <text x="1016" y="203" class="box-title">像素与状态验证</text>
    <text x="1016" y="230" class="box-text">PrintWindow / screen</text>
    <text x="1016" y="254" class="box-text">CDP screenshot</text>
    <text x="1016" y="278" class="box-text">语义 / 像素 / 副作用</text>
    <line x1="1016" y1="298" x2="1210" y2="298" stroke="#e9d5ff"/>
    <text x="1016" y="321" class="small">贯穿每一步，不替代业务判据</text>
  </g>

  <path d="M514 238 H529" class="arrow"/>
  <path d="M744 238 H759" class="arrow"/>
  <path d="M974 238 H989" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="304" y="394" width="928" height="108" rx="18" fill="#0f172a"/>
    <rect x="326" y="414" width="92" height="25" rx="12" fill="#dc2626"/>
    <text x="372" y="431" text-anchor="middle" class="pill">安全边界</text>
    <text x="326" y="467" class="box-text" fill="#f8fafc" style="fill:#f8fafc">目标唯一 · 会话/进程身份绑定 · 风险语义拒绝 · 锁屏/虚拟桌面/UIPI · 用户在场 · 遮挡检查</text>
    <text x="326" y="489" class="small" fill="#cbd5e1" style="fill:#cbd5e1">未知或超时 → exit 2 / effect=unknown；不可逆最终动作交给用户，--force 不拆闸。</text>
  </g>

  <path d="M409 350 V389" class="arrow"/>
  <path d="M639 350 V389" class="arrow"/>
  <path d="M869 350 V389" class="arrow"/>
  <path d="M1113 350 V389" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="304" y="548" width="928" height="112" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="326" y="568" width="92" height="25" rx="12" fill="#475569"/>
    <text x="372" y="585" text-anchor="middle" class="pill">证据闭环</text>
    <text x="326" y="621" class="box-title">before → action receipt → after → 独立语义/业务验证</text>
    <text x="326" y="646" class="small">收据脱敏保存目标身份、规则、哈希、焦点时长与 effect；像素变化最多证明 partial。</text>
  </g>
  <path d="M768 502 V543" class="arrow"/>
  <path d="M304 620 H272 V507 H259" class="arrow"/>

  <text x="1232" y="700" text-anchor="end" class="small">win-use-master / architecture-v1</text>
</svg>
